name: Checkout tests

on:
  pull_request:
    paths:
      - 'capstone-starter/**'
      - '.github/workflows/checkout-ci.yml'
  push:
    branches:
      - feature/checkout-test-payments

jobs:
  checkout-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: capstone-starter/pom.xml
      - name: Compile and run isolated checkout unit tests
        working-directory: capstone-starter
        run: mvn -B -Dtest=CheckoutControllerTest,StripeTestWebhookControllerTest test
