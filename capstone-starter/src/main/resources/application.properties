# Never commit credentials or signing keys. Set these environment variables locally.
datasource.url=${EASYSHOP_DB_URL:jdbc:mysql://localhost:3306/easyshop}
datasource.username=${EASYSHOP_DB_USER:root}
datasource.password=${EASYSHOP_DB_PASSWORD}

# Base64-encoded cryptographically random 64+ bytes for JWT HS512.
# Example generation: openssl rand -base64 64
jwt.secret=${EASYSHOP_JWT_SECRET}
jwt.token-timeout-seconds=${EASYSHOP_JWT_TTL_SECONDS:3600}

# Disabled by default. Test checkout does not charge real cards.
checkout.test-payments-enabled=${CHECKOUT_TEST_PAYMENTS_ENABLED:false}
checkout.stripe.test-secret-key=${CHECKOUT_STRIPE_TEST_SECRET_KEY:}
checkout.stripe.webhook-secret=${CHECKOUT_STRIPE_WEBHOOK_SECRET:}
checkout.frontend-url=${CHECKOUT_FRONTEND_URL:http://localhost:5500}
