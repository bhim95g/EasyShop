<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>EasyShop — Storefront Preview</title>
  <style>
    :root { color-scheme:light; --ink:#16243a; --muted:#6b778b; --navy:#101e36; --accent:#6657e8; --border:#e3e8ef; --surface:#fff; --bg:#f6f8fc; --green:#18825a }
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
    button,input,select{font:inherit} button{cursor:pointer} button:disabled{opacity:.45;cursor:not-allowed}
    .top{background:var(--navy);color:#fff}.top-inner{max-width:1150px;margin:auto;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
    .brand{font-size:24px;letter-spacing:-.8px;font-weight:800}.brand span{color:#a49bff}.top-actions{display:flex;gap:10px;align-items:center}
    .top button{border:1px solid #54617a;color:#fff;background:transparent;border-radius:11px;padding:9px 14px}
    .top button:hover{background:#263a59}.count{display:inline-block;background:#7467ff;color:white;padding:0 7px;border-radius:30px;margin-left:5px;font-size:12px}
    .wrap{max-width:1150px;margin:0 auto;padding:22px 24px 70px}
    .toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:22px}
    .mode{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--border);padding:8px 12px;border-radius:10px}
    .mode select{border:0;background:transparent;font-weight:700;color:var(--ink)}
    .url{border:1px solid var(--border);padding:10px 12px;border-radius:10px;min-width:220px;flex:1}
    .ghost{border:1px solid var(--border);border-radius:10px;padding:10px 15px;background:white;color:var(--ink);font-weight:650}
    .pill{font-size:12px;font-weight:700;border-radius:30px;padding:5px 11px;background:#eaf5ed;color:#177448}
    .pill.live{background:#fff3e5;color:#935519}
    .hero{background:linear-gradient(110deg,#243a67,#5d50b2 72%,#8b71e6);color:white;border-radius:22px;display:grid;grid-template-columns:1.6fr 1fr;gap:20px;padding:36px 42px;overflow:hidden}
    .eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:2px;font-weight:750;color:#cecaff}.hero h1{font-size:clamp(26px,4vw,42px);letter-spacing:-1.5px;line-height:1.14;margin:12px 0}.hero p{color:#e2dff9;max-width:440px;margin:0}.hero-art{align-self:center;font-size:85px;text-align:center;filter:drop-shadow(0 10px 20px #17183e55)}
    .section-head{display:flex;justify-content:space-between;align-items:end;gap:10px;margin:30px 0 17px}.section-head h2{font-size:22px;margin:0;letter-spacing:-.5px}.muted{color:var(--muted)}
    .filters{display:flex;gap:10px;flex-wrap:wrap}.filters input,.filters select{padding:11px 14px;border:1px solid var(--border);border-radius:11px;background:#fff;color:var(--ink)}.filters input{min-width:200px;flex:1}
    .products{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}
    .product{background:var(--surface);border:1px solid var(--border);border-radius:17px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 4px 15px #1a335008}
    .art{height:167px;display:grid;place-items:center;position:relative;font-size:77px;background:linear-gradient(140deg,#e6ebff,#ece4fa)}
    .art[data-kind="fashion"]{background:linear-gradient(140deg,#fff1ed,#f3dcd9)}.art[data-kind="home"]{background:linear-gradient(140deg,#dff7f0,#cbe7e7)}
    .feature{position:absolute;top:12px;left:12px;font-size:11px;font-weight:800;padding:5px 9px;border-radius:7px;background:white;color:#584ac0}
    .product-body{padding:17px;display:flex;flex:1;flex-direction:column}.cat{color:#7367c7;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px}.product h3{font-size:17px;line-height:1.3;margin:5px 0}
    .desc{font-size:13px;color:var(--muted);margin:0 0 16px;flex:1;min-height:39px}.buy{display:flex;gap:10px;align-items:center;justify-content:space-between}
    .price{font-size:20px;font-weight:800}.primary{background:var(--accent);border:0;color:white;padding:10px 17px;border-radius:10px;font-weight:750}.primary:hover{background:#5344d0}
    .empty{background:white;border:1px solid var(--border);padding:35px;border-radius:15px;text-align:center;grid-column:1/-1}
    .overlay{position:fixed;inset:0;background:#0e1a2a88;z-index:20;display:none;justify-content:flex-end}.overlay.open{display:flex}
    .panel{background:white;width:min(455px,100vw);height:100%;overflow:auto;padding:25px;box-shadow:-8px 0 35px #09152430}
    .panel-head{display:flex;align-items:center;justify-content:space-between;gap:15px}.panel h2{margin:0;font-size:23px}.close{background:transparent;border:0;font-size:27px;color:#54617c;padding:0 8px}
    .line{border-bottom:1px solid var(--border);padding:17px 0;display:flex;align-items:center;gap:14px}
    .item-art{font-size:30px;background:#f1f2ff;border-radius:12px;padding:11px}.grow{flex:1}.qty{display:flex;gap:10px;align-items:center;margin-top:9px}
    .qty button{background:white;border:1px solid var(--border);border-radius:8px;min-width:30px;min-height:28px}
    .total{display:flex;justify-content:space-between;font-size:20px;font-weight:800;padding:20px 0}
    .field{margin:12px 0}.field label{display:block;color:#4a5a72;font-size:12px;font-weight:750;margin-bottom:4px}.field input{width:100%;border:1px solid #dbe1eb;border-radius:9px;padding:10px 12px}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px}.span2{grid-column:1/-1}
    .note{background:#eff4fd;color:#526078;border-radius:11px;padding:13px;font-size:13px;margin-top:18px}
    .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#172841;color:white;border-radius:11px;padding:13px 18px;box-shadow:0 8px 25px #1c2c4255;z-index:30;max-width:min(90vw,580px);display:none}
    .toast.show{display:block}.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
    @media(max-width:750px){.hero{grid-template-columns:1fr;padding:25px}.hero-art{display:none}.products{grid-template-columns:repeat(2,minmax(0,1fr))}.wrap{padding:16px}.form-grid{grid-template-columns:1fr}}
    @media(max-width:500px){.products{grid-template-columns:1fr}.top-inner{padding:14px 18px}.product .art{height:160px}}
  </style>
</head>
<body>
  <header class="top"><div class="top-inner">
    <div class="brand">easy<span>shop.</span></div>
    <div class="top-actions"><button id="profileBtn">👤 My profile</button><button id="ordersBtn">📦 Orders</button><button id="cartBtn">🛒 Cart <span class="count" id="cartCount">0</span></button></div>
  </div></header>
  <main class="wrap">
    <div class="toolbar">
      <label class="mode">Connection <select id="mode"><option value="demo">Demo (no server)</option><option value="api">Live API</option></select></label>
      <input class="url" id="apiUrl" value="http://localhost:8080" aria-label="Backend API URL" placeholder="http://localhost:8080" hidden>
      <button class="ghost" id="reloadBtn">↻ Refresh</button>
      <span class="pill" id="modeLabel">Interactive demo data</span>
    </div>
    <section class="hero"><div>
      <div class="eyebrow">Welcome to EasyShop</div>
      <h1>Find your next favorite thing.</h1>
      <p>Explore products, build a shopping cart and manage your customer profile. Switch to Live API when your Spring Boot server is running.</p>
    </div><div class="hero-art" aria-hidden="true">🛍️ ✨</div></section>
    <div class="section-head"><h2>Explore products</h2><span id="productCount" class="muted"></span></div>
    <div class="filters"><input type="search" id="search" placeholder="Search the catalog..." aria-label="Search products"><select id="category" aria-label="Filter by category"><option value="">All categories</option></select></div>
    <div class="products" id="products" style="margin-top:18px" aria-live="polite"></div>
  </main>
  <div class="overlay" id="overlay" role="presentation"><aside class="panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle">
    <div class="panel-head"><h2 id="panelTitle">Cart</h2><button class="close" id="closeBtn" aria-label="Close panel">×</button></div>
    <div id="panelBody"></div>
  </aside></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
  "use strict";
  // Do not store JWTs in localStorage: credentials and tokens are held in memory only.
  const demoCategories = [
    {categoryId:1,name:"Electronics"},
    {categoryId:2,name:"Fashion"},
    {categoryId:3,name:"Home & Kitchen"}
  ];
  const demoProducts = [
    {productId:1,name:"Smartphone",price:499.99,categoryId:1,description:"A powerful smartphone for all your daily needs.",stock:50,featured:true},
    {productId:2,name:"Wireless Headphones",price:129.99,categoryId:1,description:"Immersive, detailed audio wherever you go.",stock:30,featured:true},
    {productId:3,name:"Laptop",price:899.99,categoryId:1,description:"Performance and portability, together.",stock:25,featured:false},
    {productId:4,name:"Everyday Sneakers",price:89,categoryId:2,description:"Comfortable, versatile everyday style.",stock:18,featured:false},
    {productId:5,name:"Classic Jacket",price:149,categoryId:2,description:"A timeless wardrobe essential.",stock:12,featured:true},
    {productId:6,name:"Coffee Maker",price:79.99,categoryId:3,description:"Better mornings start with great coffee.",stock:45,featured:false},
    {productId:7,name:"Modern Lamp",price:59,categoryId:3,description:"A warm glow for any corner.",stock:28,featured:false},
    {productId:8,name:"Smart TV",price:1499.99,categoryId:1,description:"Bright detail and cinematic visuals.",stock:10,featured:false},
    {productId:9,name:"Ceramic Mug Set",price:34,categoryId:3,description:"Beautifully simple for everyday use.",stock:40,featured:false}
  ];
  const initialProfile={firstName:"Alex",lastName:"Morgan",phone:"412-555-0100",email:"alex@example.com",address:"123 Market Street",city:"Pittsburgh",state:"PA",zip:"15222"};
  const fields=["firstName","lastName","phone","email","address","city","state","zip"];
  const fieldLabels=["First name","Last name","Phone","Email","Street address","City","State","ZIP code"];
  const state={mode:"demo",products:demoProducts,categories:demoCategories,cart:{},profile:{...initialProfile},demoOrders:[],demoOrderCounter:1000,token:null,user:null,panel:null,search:"",category:""};
  const $=id=>document.getElementById(id);
  const money=n=>new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"}).format(Number(n)||0);
  const escapeHtml=s=>String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const kind=p=>p.categoryId===2?"fashion":p.categoryId===3?"home":"tech";
  const emoji=p=>{const n=(p.name||"").toLowerCase();return n.includes("headphone")?"🎧":n.includes("phone")?"📱":n.includes("laptop")?"💻":n.includes("tv")?"📺":n.includes("shoe")||n.includes("sneaker")?"👟":n.includes("jacket")?"🧥":n.includes("coffee")?"☕":n.includes("lamp")?"💡":n.includes("mug")?"🍵":n.includes("watch")?"⌚":"📦"};
  const categoryName=id=>state.categories.find(c=>Number(c.categoryId)===Number(id))?.name||"Products";
  const items=()=>Object.values(state.cart.items||state.cart);
  const toast=msg=>{ $("toast").textContent=msg;$("toast").classList.add("show");clearTimeout(toast.timer);toast.timer=setTimeout(()=>$("toast").classList.remove("show"),3500); };
  async function api(path,opts={}){
    const base=$("apiUrl").value.trim().replace(/\/+$/,"");
    if(!/^https?:\/\/[^/]+/i.test(base))throw Error("Enter a valid http:// or https:// backend URL.");
    const headers={...(opts.body?{"Content-Type":"application/json"}:{}),...(state.token?{"Authorization":"Bearer "+state.token}:{})};
    let response;
    try { response=await fetch(base+path,{...opts,headers:{...headers,...opts.headers}}); }
    catch(e){throw Error("Cannot reach API. Start Spring Boot and check the backend URL/CORS settings.");}
    if(!response.ok)throw Error("API "+response.status+" — "+(response.status===401?"Please sign in.":response.status===404?"Endpoint or item not found.":"Check your backend logs."));
    if(response.status===204)return null;
    const text=await response.text();return text?JSON.parse(text):null;
  }
  function renderCategories(){
    const options=['<option value="">All categories</option>'].concat(state.categories.map(c=>'<option value="'+Number(c.categoryId)+'">'+escapeHtml(c.name)+'</option>'));
    $("category").innerHTML=options.join("");$("category").value=state.category;
  }
  function renderProducts(){
    const q=state.search.toLowerCase();
    const filtered=state.products.filter(p=>(!state.category||Number(p.categoryId)===Number(state.category))&&(p.name+" "+(p.description||"")).toLowerCase().includes(q));
    $("productCount").textContent=filtered.length+" items";
    $("products").innerHTML=filtered.length?filtered.map(p=>
      '<article class="product"><div class="art" data-kind="'+kind(p)+'">'+(p.featured?'<span class="feature">FEATURED</span>':'')+
      '<span aria-hidden="true">'+emoji(p)+'</span></div><div class="product-body"><span class="cat">'+escapeHtml(categoryName(p.categoryId))+'</span>'+
      '<h3>'+escapeHtml(p.name)+'</h3><p class="desc">'+escapeHtml(p.description||"")+'</p><div class="buy"><span class="price">'+money(p.price)+'</span>'+
      '<button class="primary" data-add="'+Number(p.productId)+'" '+(Number(p.stock)<=0?"disabled":"")+'>'+(Number(p.stock)<=0?"Sold out":"+ Add")+'</button></div></div></article>'
    ).join(""):'<div class="empty">No matching products. Try another search or category.</div>';
  }
  function renderCount(){
    $("cartCount").textContent=items().reduce((sum,i)=>sum+Number(i.quantity||0),0);
  }
  function showPanel(title,body,afterRender){
    state.panel=title;$("panelTitle").textContent=title;$("panelBody").innerHTML=body;
    $("overlay").classList.add("open");
    if(afterRender)afterRender();
    $("closeBtn").focus();
  }
  function closePanel(){$("overlay").classList.remove("open");state.panel=null;}
  function requireSession(){if(state.mode==="api"&&!state.token){showLogin();return false;}return true;}
  async function refresh(){
    try{
      if(state.mode==="demo"){
        state.products=demoProducts;state.categories=demoCategories;state.cart=state.cart||{};state.profile=state.profile||{...initialProfile};
      }else{
        const [products,categories]=await Promise.all([api("/products"),api("/categories")]);
        state.products=Array.isArray(products)?products:[];state.categories=Array.isArray(categories)?categories:[];
        if(state.token)await refreshCart();
        else state.cart={};
      }
      renderCategories();renderProducts();renderCount();
      $("modeLabel").textContent=state.mode==="demo"?"Interactive demo data":"Connected mode";
      $("modeLabel").className="pill"+(state.mode==="api"?" live":"");
    }catch(e){toast(e.message);renderProducts();}
  }
  async function refreshCart(){const cart=await api("/cart");state.cart=cart?.items||{};renderCount();}
  async function addItem(id){
    if(!requireSession())return;
    try{
      if(state.mode==="demo"){
        const product=state.products.find(p=>p.productId===id);
        if(!product)return;
        if(!state.cart[id])state.cart[id]={product,quantity:0,discountPercent:0};
        state.cart[id].quantity++;
      }else{await api("/cart/products/"+id,{method:"POST"});await refreshCart();}
      renderCount();toast("Added to cart");
      if(state.panel==="Your cart")showCart();
    }catch(e){toast(e.message);}
  }
  async function changeQuantity(id,delta){
    const cartItem=state.cart[id];if(!cartItem)return;
    const quantity=Number(cartItem.quantity)+delta;
    if(quantity<1){toast("Use Clear cart to remove cart items.");return;}
    try{
      if(state.mode==="demo")cartItem.quantity=quantity;
      else{await api("/cart/products/"+id,{method:"PUT",body:JSON.stringify({quantity})});await refreshCart();}
      renderCount();showCart();
    }catch(e){toast(e.message);}
  }
  async function clearCart(){
    try{
      if(state.mode==="demo")state.cart={};
      else {await api("/cart",{method:"DELETE"});await refreshCart();}
      renderCount();showCart();toast("Cart cleared");
    }catch(e){toast(e.message);}
  }
  async function showCart(){
    if(!requireSession())return;
    try{
      if(state.mode==="api")await refreshCart();
      const cartItems=items(), total=cartItems.reduce((s,i)=>s+(Number(i.product?.price)||0)*Number(i.quantity||0)*(1-Number(i.discountPercent||0)),0);
      const body=cartItems.length?cartItems.map(i=>
        '<div class="line"><div class="item-art">'+emoji(i.product||{})+'</div><div class="grow"><strong>'+escapeHtml(i.product?.name||"Product")+
        '</strong><div class="muted">'+money(i.product?.price)+'</div><div class="qty"><button data-qty="-1" data-id="'+Number(i.product?.productId)+'" aria-label="Decrease quantity">−</button>'+
        '<strong>'+Number(i.quantity)+'</strong><button data-qty="1" data-id="'+Number(i.product?.productId)+'" aria-label="Increase quantity">+</button></div></div>'+
        '<strong>'+money((Number(i.product?.price)||0)*Number(i.quantity||0))+'</strong></div>'
      ).join("")+'<div class="total"><span>Estimated total</span><span>'+money(total)+'</span></div><button class="ghost" id="clearBtn">Clear cart</button>':
      '<div class="note">Your cart is empty. Browse products and choose “Add”.</div>';
      showPanel("Your cart",body+(cartItems.length?'<button class="primary" id="checkoutBtn" style="margin-top:15px">Proceed to checkout</button>':'')+'<div class="note">Checkout supports simulated payments and Stripe test mode. No real charges.</div>');
    }catch(e){toast(e.message);}
  }
  function showLogin(){
    showPanel("Sign in",'<p class="muted">Sign in to the live EasyShop backend with an existing account. Demo mode requires no login.</p>'+
      '<form id="loginForm"><div class="field"><label for="username">Username</label><input id="username" autocomplete="username" required></div>'+
      '<div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div>'+
      '<button type="submit" class="primary">Sign in</button></form>');
  }
  async function showProfile(){
    if(!requireSession())return;
    try{
      const profile=state.mode==="demo"?state.profile:await api("/profile");
      state.profile=profile;
      const body='<p class="muted">Update your personal details. Changes in Demo mode are not saved to a backend.</p>'+
        '<form id="profileForm"><div class="form-grid">'+fields.map((key,i)=>
        '<div class="field '+(key==="email"||key==="address"?"span2":"")+'"><label for="f_'+key+'">'+fieldLabels[i]+'</label>'+
        '<input id="f_'+key+'" name="'+key+'" maxlength="'+({firstName:50,lastName:50,phone:20,email:200,address:200,city:50,state:50,zip:20}[key])+
        '" '+(key==="email"?'type="email" ':'')+'required value="'+escapeHtml(profile[key]??"")+'"></div>').join("")+'</div>'+
        '<button type="submit" class="primary">Save changes</button></form>'+
        (state.mode==="api"?'<button class="ghost" style="margin-top:12px" id="signOutBtn">Sign out</button>':'');
      showPanel("My profile",body);
      // The API allows empty strings; an empty field is valid and can be used to clear it.
      fields.forEach(key=>$("f_"+key).removeAttribute("required"));
    }catch(e){toast(e.message);if(state.mode==="api"&&e.message.includes("404"))toast("Profile endpoint requires PR #3 to be merged/running.");}
  }

  let pendingTestOrder=null;
  const orderSummary=order=>'<div class="note">Order #'+escapeHtml(order.orderId)+' · '+escapeHtml(order.status)+'</div>'+
    (order.items||[]).map(i=>'<div class="line"><div class="grow"><strong>'+escapeHtml(i.name||'Product')+'</strong><div class="muted">Qty '+Number(i.quantity)+' × '+money(i.unitPrice)+'</div></div><strong>'+money(Number(i.quantity)*Number(i.unitPrice))+'</strong></div>').join('')+
    '<div class="total"><span>Total (USD)</span><span>'+money(order.total)+'</span></div>';
  async function showCheckout(){
    if(!requireSession())return;
    try{
      if(state.mode==="api")await refreshCart();
      if(!items().length){toast("Your cart is empty.");return;}
      let options='<option value="SIMULATED">Simulated test payment (no card)</option><option value="STRIPE_TEST">Stripe hosted test checkout</option>';
      if(state.mode==="api"){
        const config=await api("/checkout/config");
        options=(config.simulatedPaymentsEnabled?'<option value="SIMULATED">Simulated test payment (no card)</option>':'')+
                (config.stripeTestEnabled?'<option value="STRIPE_TEST">Stripe hosted test checkout</option>':'');
        if(!options){toast("Enable sandbox checkout in your backend settings.");return;}
      }
      const total=items().reduce((sum,item)=>sum+Number(item.product?.price||0)*Number(item.quantity||0)*(1-Number(item.discountPercent||0)),0);
      const body='<p class="muted">Shipping details and test payment. Prices are recalculated by the backend in Live mode.</p>'+
        '<div class="total"><span>Cart estimate</span><span>'+money(total)+'</span></div>'+
        '<form id="checkoutForm">'+
        '<div class="field"><label for="shipAddress">Street address</label><input id="shipAddress" maxlength="100" required value="'+escapeHtml(state.profile?.address||'')+'"></div>'+
        '<div class="form-grid"><div class="field"><label for="shipCity">City</label><input id="shipCity" maxlength="50" required value="'+escapeHtml(state.profile?.city||'')+'"></div>'+
        '<div class="field"><label for="shipState">State</label><input id="shipState" maxlength="50" required value="'+escapeHtml(state.profile?.state||'')+'"></div>'+
        '<div class="field"><label for="shipZip">ZIP code</label><input id="shipZip" maxlength="20" required value="'+escapeHtml(state.profile?.zip||'')+'"></div>'+
        '<div class="field"><label for="paymentMethod">Payment test</label><select id="paymentMethod" style="width:100%;padding:10px;border:1px solid #dbe1eb;border-radius:9px">'+options+'</select></div></div>'+
        '<button class="primary" type="submit">Place test order</button></form>'+
        '<div class="note">Sandbox only. Never enter real card details into this form. Stripe test cards are entered only on Stripe’s hosted page.</div>';
      showPanel("Checkout · test only",body);
    }catch(e){toast(e.message);}
  }
  async function placeCheckout(){
    const button=document.querySelector("#checkoutForm button[type=submit]");
    if(button)button.disabled=true;
    const request={address:$("shipAddress").value.trim(),city:$("shipCity").value.trim(),state:$("shipState").value.trim(),
      zip:$("shipZip").value.trim(),paymentMethod:$("paymentMethod").value};
    try{
      let order;
      if(state.mode==="demo"){
        order={orderId:++state.demoOrderCounter,status:"PENDING_PAYMENT",paymentMethod:request.paymentMethod,
          items:items().map(i=>({productId:i.product.productId,name:i.product.name,quantity:i.quantity,unitPrice:i.product.price})),
          total:items().reduce((s,i)=>s+Number(i.product.price)*Number(i.quantity)*(1-Number(i.discountPercent||0)),0),
          ...request,createdAt:new Date().toISOString()};
        state.demoOrders.unshift(order);state.cart={};renderCount();
      }else{
        order=await api("/checkout/orders",{method:"POST",body:JSON.stringify(request)});
        await refreshCart();
      }
      if(request.paymentMethod==="STRIPE_TEST" && state.mode==="api"){
        if(!/^https:\/\/checkout\.stripe\.com\//.test(order.checkoutUrl||''))throw Error("Unexpected checkout URL.");
        window.location.assign(order.checkoutUrl);return;
      }
      pendingTestOrder=order;
      if(request.paymentMethod==="STRIPE_TEST" && state.mode==="demo"){
        showPanel("Stripe test preview",orderSummary(order)+'<div class="note">Demo mode cannot connect to Stripe. Switch to Live API with Stripe test keys to use hosted payment pages.</div><button class="ghost" id="testDecline">Cancel test order</button>');
      }else{
        showPanel("Simulate a payment",orderSummary(order)+
          '<p class="muted">Choose an outcome to test both successful and declined payments.</p>'+
          '<div style="display:flex;gap:9px;flex-wrap:wrap"><button class="primary" id="testApprove">✓ Approve test payment</button><button class="ghost" id="testDecline">✕ Decline test payment</button></div>');
      }
    }catch(e){toast(e.message);if(button)button.disabled=false;}
  }
  async function finishSimulation(outcome){
    if(!pendingTestOrder)return;
    try{
      let order;
      if(state.mode==="demo"){
        order=pendingTestOrder;order.status=outcome==="APPROVED"?"PAID":"DECLINED";
      }else{
        order=await api("/checkout/orders/"+pendingTestOrder.orderId+"/simulate",
          {method:"POST",body:JSON.stringify({outcome})});
      }
      pendingTestOrder=null;
      showPanel("Test payment "+(order.status==="PAID"?"approved":"declined"),
        orderSummary(order)+'<button class="primary" id="viewOrdersBtn">View order history</button>');
      toast("Order #"+order.orderId+" · "+order.status);
    }catch(e){toast(e.message);}
  }
  async function showOrders(){
    if(!requireSession())return;
    try{
      const orders=state.mode==="demo"?state.demoOrders:await api("/checkout/orders");
      const rows=(Array.isArray(orders)?orders:[]);
      showPanel("Order history",rows.length?rows.map(order=>
        '<div style="padding:13px 0;border-bottom:1px solid #e3e8ef">'+
          '<div style="display:flex;justify-content:space-between"><strong>Order #'+escapeHtml(order.orderId)+'</strong><strong>'+money(order.total)+'</strong></div>'+
          '<div class="muted">'+escapeHtml(order.status)+' · '+escapeHtml(order.paymentMethod)+' · '+escapeHtml((order.createdAt||'').slice(0,10))+'</div>'+
          '<div style="font-size:13px;margin-top:5px">'+(order.items||[]).map(i=>Number(i.quantity)+' × '+escapeHtml(i.name||'Product')).join(', ')+'</div></div>'
        ).join(''):'<div class="note">No orders yet. Try placing a test order from your cart.</div>');
    }catch(e){toast(e.message);}
  }

  document.addEventListener("click",async event=>{
    const add=event.target.closest("[data-add]");if(add){await addItem(Number(add.dataset.add));return;}
    const qty=event.target.closest("[data-qty]");if(qty){await changeQuantity(Number(qty.dataset.id),Number(qty.dataset.qty));return;}
    if(event.target.id==="clearBtn"){await clearCart();return;}
    if(event.target.id==="checkoutBtn"){await showCheckout();return;}
    if(event.target.id==="testApprove"){await finishSimulation("APPROVED");return;}
    if(event.target.id==="testDecline"){await finishSimulation("DECLINED");return;}
    if(event.target.id==="viewOrdersBtn"){await showOrders();return;}
    if(event.target.id==="signOutBtn"){state.token=null;state.user=null;state.cart={};renderCount();closePanel();toast("Signed out");}
  });
  document.addEventListener("submit",async event=>{
    if(event.target.id==="loginForm"){
      event.preventDefault();
      const username=$("username").value,password=$("password").value;
      try{
        const result=await api("/login",{method:"POST",body:JSON.stringify({username,password})});
        if(!result?.token)throw Error("Login succeeded without a token.");
        state.token=result.token;state.user=result.user||null;
        closePanel();await refreshCart();toast("Signed in successfully");
      }catch(e){toast(e.message);}
    }
    if(event.target.id==="checkoutForm"){
      event.preventDefault();await placeCheckout();
    }
    if(event.target.id==="profileForm"){
      event.preventDefault();const payload={};
      for(const key of fields)payload[key]=$("f_"+key).value;
      try{
        if(state.mode==="demo")state.profile={...payload};
        else state.profile=await api("/profile",{method:"PUT",body:JSON.stringify(payload)});
        toast("Profile saved"+(state.mode==="demo"?" in this demo":""));
        closePanel();
      }catch(e){toast(e.message);}
    }
  });
  $("mode").addEventListener("change",async()=>{
    state.mode=$("mode").value;state.cart={};state.token=null;state.user=null;state.category="";state.search="";
    $("search").value="";$("apiUrl").hidden=state.mode!=="api";
    closePanel();await refresh();
    toast(state.mode==="demo"?"Demo mode: actions use sample data.":"Live mode: enter your backend URL and refresh.");
  });
  $("reloadBtn").addEventListener("click",refresh);
  $("cartBtn").addEventListener("click",showCart);
  $("profileBtn").addEventListener("click",showProfile);
  $("ordersBtn").addEventListener("click",showOrders);
  $("closeBtn").addEventListener("click",closePanel);
  $("overlay").addEventListener("click",e=>{if(e.target===$("overlay"))closePanel();});
  $("search").addEventListener("input",e=>{state.search=e.target.value;renderProducts();});
  $("category").addEventListener("change",e=>{state.category=e.target.value;renderProducts();});
  $("apiUrl").addEventListener("change",refresh);
  renderCategories();renderProducts();renderCount();
  </script>
</body>
</html>
